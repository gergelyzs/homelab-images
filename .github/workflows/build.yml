# Builds images/<name>/ into ghcr.io/<owner>/<name> for amd64 + arm64 (the k3s
# cluster has a Raspberry Pi node).
#
#   pull request  - builds + smoke-tests the images whose folder changed, pushes nothing
#   push to main  - the same, then pushes the images whose folder changed
#   manual run    - builds one image, or all of them
#
# Every image needs images/<name>/test.sh: it runs inside the built image on
# BOTH platforms (amd64 and arm64, the Pi node) and must exit 0, otherwise the
# image is not pushed. Keep it to quick checks that the binaries start and the
# Python packages import - the failure being guarded against is an image that
# builds fine but is broken at runtime (a missing shared library, a dropped
# package), which Renovate would otherwise roll out to the cluster on its own.
#
# Tags: <YYYY.MM.DD>.<run number> (sortable, so Renovate in home-config/homeops
# moves the deployments to it) and latest.
name: Build images

on:
  pull_request:
    paths: ["images/**"]
  push:
    branches: [main]
    paths: ["images/**"]
  workflow_dispatch:
    inputs:
      image:
        description: Image folder to build (empty = all)
        required: false

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.list.outputs.images }}
      version: ${{ steps.list.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Which images to build
        id: list
        env:
          INPUT: ${{ inputs.image }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            names=$(git diff --name-only "$BASE" "$GITHUB_SHA" -- images | cut -d/ -f2 | sort -u)
          elif [ "$EVENT" = workflow_dispatch ]; then
            if [ -n "$INPUT" ]; then names="$INPUT"; else names=$(ls images); fi
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            names=$(ls images)
          else
            names=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- images | cut -d/ -f2 | sort -u)
          fi
          json=$(for n in $names; do [ -f "images/$n/Dockerfile" ] && echo "$n"; done | jq -R . | jq -sc .)
          echo "images=$json" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building: $json"

  test:
    needs: plan
    if: needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: images/${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: test/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Smoke test
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ ! -f "images/$IMAGE/test.sh" ]; then
            echo "::error::images/$IMAGE/test.sh is missing - every image needs a smoke test"
            exit 1
          fi
          docker run --rm --platform "$PLATFORM" \
            -v "$PWD/images/$IMAGE/test.sh:/test.sh:ro" \
            "test/$IMAGE:ci" sh /test.sh

  build:
    needs: [plan, test]
    if: github.event_name != 'pull_request' && needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: images/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.plan.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
